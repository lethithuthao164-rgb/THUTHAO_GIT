<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        body { 
            background: #fff5f7; color: #7d5a5a; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; 
            background-image: radial-gradient(#ffdee9 2px, transparent 2px); background-size: 30px 30px;
        }
        .game-box { text-align: center; width: 100%; max-width: 600px; margin-top: 50px; }
        .progress-container { width: 200px; height: 12px; background: #eee; border-radius: 10px; margin: 0 auto 30px; border: 2px solid #fff; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: #ff85a1; transition: width 0.5s ease; }
        #game-grid { display: grid; justify-content: center; gap: 12px; perspective: 1000px; }
        .card { width: 70px; height: 90px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .card.flipped { transform: rotateY(180deg); }
        .card.matched { opacity: 0; transform: scale(0); transition: all 0.7s ease-in-out; pointer-events: none; }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 35px; border-radius: 18px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .card-back { background: #ffc2d1; color: white; border: 3px solid #fff; }
        .card-front { background: #fff; transform: rotateY(180deg); border: 3px solid #ffc2d1; }
        #win-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 245, 247, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        button { padding: 12px 30px; background: #ff85a1; color: white; border: none; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-box">
        <div class="progress-container"><div id="progress-fill"></div></div>
        <div id="game-grid"></div>
    </div>
    <div id="win-screen">
        <h1>👑</h1>
        <button onclick="location.reload()">Chơi lại</button>
    </div>

    <script src="test3.js" defer></script>
</body>
</html>
